name: Release verification
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global pnpm@11.18.0
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-luatex texlive-latex-extra texlive-lang-chinese texlive-fonts-recommended texlive-bibtex-extra texlive-publishers biber
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Match release tag to package version
        if: github.ref_type == 'tag'
        run: node -e "if ('v'+require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: pnpm release:check
      - run: pnpm package:release
      - uses: actions/upload-artifact@v4
        with:
          name: latex-studio-release
          path: release/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-browser-failures
          path: |
            test-results/
            playwright-report/
